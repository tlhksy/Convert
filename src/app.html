<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="ui.title">Pafta — vector data converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBED; --panel:#FAFBFB; --grid-fine:#D6DDE1; --grid-major:#BFC9CF;
  --ink:#14191E; --ink2:#44525C; --muted:#78868F; --rule:#C6CFD4;
  --blue:#1D4E89; --blue-soft:#E3EAF3; --amber:#8E6205; --red:#9B2B22; --green:#1C6547;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif;
  background-image:
    linear-gradient(var(--grid-fine) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-fine) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 80px}

/* ---------- header ---------- */
header{border-bottom:1.5px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
.eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
h1{font:700 clamp(34px,6vw,58px)/0.94 Archivo,sans-serif;letter-spacing:-.035em;margin:10px 0 8px}
h1 span{color:var(--muted);font-weight:500}
.sub{max-width:56ch;color:var(--ink2);font-size:15px;margin:0}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--rule);background:var(--panel);color:var(--ink2);padding:6px 9px;border-radius:var(--r)}
.badge.on{border-color:var(--green);color:var(--green)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:22px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r)}
.step{padding:16px 16px 18px;border-bottom:1px solid var(--rule)}
.step:last-child{border-bottom:0}
.step-h{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.step-n{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--blue);border:1px solid var(--blue);
  border-radius:2px;padding:3px 5px;letter-spacing:.04em}
.step-t{font:600 13px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.hint{font-size:12.5px;color:var(--muted);margin:7px 0 0}

label.fl{display:block;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink2);margin:12px 0 5px}
select,input[type=text],input[type=number]{
  width:100%;font:400 14px/1.3 "IBM Plex Sans",sans-serif;color:var(--ink);
  background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:8px 9px}
select:focus,input:focus,button:focus-visible,.drop:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* dropzone */
.drop{border:1.5px dashed var(--rule);border-radius:var(--r);background:#fff;
  padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.hot{border-color:var(--blue);background:var(--blue-soft)}
.drop b{display:block;font:600 14px/1.3 Archivo,sans-serif;letter-spacing:-.01em}
.drop small{display:block;color:var(--muted);font:400 12px/1.5 "IBM Plex Mono",monospace;margin-top:5px}
.files{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.files li{display:flex;align-items:center;gap:8px;font:400 12.5px/1.3 "IBM Plex Mono",monospace;
  border:1px solid var(--rule);border-radius:var(--r);padding:6px 8px;background:#fff}
.files .ext{font-weight:500;color:var(--blue);text-transform:uppercase}
.files .sz{margin-left:auto;color:var(--muted);font-size:11.5px}

/* segmented output */
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{font:500 12.5px/1 "IBM Plex Mono",monospace;letter-spacing:.03em;text-transform:uppercase;
  background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:10px 6px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.opts{margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 88px;gap:8px}

.go{width:100%;margin-top:6px;font:600 14px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;
  background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:var(--r);
  padding:14px;cursor:pointer;transition:filter .15s}
.go:hover:not(:disabled){filter:brightness(1.15)}
.go:disabled{background:var(--panel);color:var(--muted);border-color:var(--rule);cursor:not-allowed}

/* ---------- viewport (signature) ---------- */
.stage{display:flex;flex-direction:column;gap:14px}
.vp{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.vp-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--rule);
  font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--ink2)}
.vp-bar .k{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.vp-bar .v{font-weight:500;color:var(--ink)}
.vp-bar .v.warn{color:var(--red)}
.vp-bar .spacer{margin-left:auto}
canvas{display:block;width:100%;height:440px;background:#fff;cursor:crosshair;touch-action:none}
@media(max-width:600px){canvas{height:300px}}
.vp-foot{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--rule);
  font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--muted)}
.scalebar{height:6px;border:1px solid var(--ink2);border-top:0;min-width:60px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--rule);
  font:400 11.5px/1 "IBM Plex Mono",monospace}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}

/* ---------- log ---------- */
.log-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--rule)}
.log-h h2{font:600 13px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:0}
.log-h .count{font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--muted)}
.log{margin:0;padding:0;list-style:none;max-height:290px;overflow:auto}
.log li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid #EDF0F1;
  font:400 12.5px/1.5 "IBM Plex Sans",sans-serif}
.log li:last-child{border-bottom:0}
.log .tag{font:500 10px/1.6 "IBM Plex Mono",monospace;letter-spacing:.07em;text-transform:uppercase;
  border-left:2px solid var(--muted);padding-left:6px;color:var(--muted)}
.log .lv-err .tag{border-color:var(--red);color:var(--red)}
.log .lv-warn .tag{border-color:var(--amber);color:var(--amber)}
.log .lv-ok .tag{border-color:var(--green);color:var(--green)}
.log .lv-info .tag{border-color:var(--blue);color:var(--blue)}
.log .fix{display:inline-block;margin-top:5px;font:500 11.5px/1 "IBM Plex Mono",monospace;
  background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:2px;padding:5px 7px;cursor:pointer}
.log .fix:hover{background:var(--blue);color:#fff}
.empty{padding:26px 14px;color:var(--muted);font-size:13.5px;text-align:center}

/* attribute table */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule)}
.tabs button{font:500 11.5px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue)}
.tblwrap{max-height:300px;overflow:auto}
table{border-collapse:collapse;width:100%;font:400 12px/1.4 "IBM Plex Mono",monospace}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid #EDF0F1;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-weight:500;color:var(--ink2);
  text-transform:uppercase;font-size:10.5px;letter-spacing:.07em;border-bottom:1px solid var(--rule)}
td.num{text-align:right}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);
  font:400 12px/1.7 "IBM Plex Mono",monospace;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.badge.lang{cursor:pointer;font:inherit;font-size:inherit;border-style:solid;
  -webkit-appearance:none;appearance:none}
.badge.lang:hover{filter:brightness(.95)}
.badge.lang:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow" data-i18n="ui.eyebrow"></div>
  <h1>Pafta <span data-i18n="ui.h1sub"></span></h1>
  <p class="sub" data-i18n="ui.sub"></p>
  <div class="badges">
    <span class="badge on" data-i18n="ui.badge.local"></span>
    <span class="badge" data-i18n="ui.badge.noserver"></span>
    <span class="badge">DXF R12 · AC1009</span>
    <span class="badge" id="capzip">ZIP</span>
    <button class="badge lang" id="lang" type="button" data-i18n="ui.lang"></button>
  </div>
</header>

<div class="cols">
  <!-- ================= control rail ================= -->
  <div class="panel" role="region" data-i18n-aria="ui.panel.settings">
    <div class="step">
      <div class="step-h"><span class="step-n">01</span><span class="step-t" data-i18n="ui.step.file"></span></div>
      <div class="drop" id="drop" tabindex="0" role="button" data-i18n-aria="ui.drop.aria">
        <b data-i18n="ui.drop.main"></b>
        <small>.zip · .shp+.dbf+.shx · .geojson · .kml · .gpx · .csv</small>
      </div>
      <input type="file" id="file" multiple class="sr" accept=".zip,.shp,.dbf,.shx,.prj,.cpg,.geojson,.json,.kml,.gpx,.csv,.txt">
      <ul class="files" id="filelist"></ul>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">02</span><span class="step-t" data-i18n="ui.step.srcCrs"></span></div>
      <select id="src"></select>
      <p class="hint" id="srchint" data-i18n="ui.hint.srcAuto"></p>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">03</span><span class="step-t" data-i18n="ui.step.dstCrs"></span></div>
      <select id="dst"></select>
      <p class="hint" id="dsthint"></p>
    </div>

    <div class="step">
      <div class="step-h"><span class="step-n">04</span><span class="step-t" data-i18n="ui.step.output"></span></div>
      <div class="seg" id="fmt">
        <button data-f="dxf" aria-pressed="true">DXF</button>
        <button data-f="shp" aria-pressed="false">Shapefile</button>
        <button data-f="geojson" aria-pressed="false">GeoJSON</button>
        <button data-f="kml" aria-pressed="false">KML</button>
        <button data-f="csv" aria-pressed="false">CSV</button>
        <button data-f="gpkgless" aria-pressed="false" disabled data-i18n-title="ui.gpkg.soon">GPKG</button>
      </div>
      <div class="opts" id="opt-dxf">
        <label class="fl" for="lf" data-i18n="ui.opt.layerField"></label>
        <select id="lf"></select>
        <div class="row2">
          <div>
            <label class="fl" for="tf" data-i18n="ui.opt.labelField"></label>
            <select id="tf"></select>
          </div>
          <div>
            <label class="fl" for="th" data-i18n="ui.opt.textHeight"></label>
            <input type="number" id="th" value="2" min="0.01" step="0.5">
          </div>
        </div>
      </div>
      <div class="opts" id="opt-lab" hidden>
        <label class="fl" for="lab2" data-i18n="ui.opt.nameField"></label>
        <select id="lab2"></select>
      </div>
    </div>

    <div class="step">
      <button class="go" id="go" disabled data-i18n="ui.go"></button>
      <p class="hint" id="gohint" data-i18n="ui.hint.needFile"></p>
    </div>
  </div>

  <!-- ================= stage ================= -->
  <div class="stage">
    <div class="vp">
      <div class="vp-bar">
        <span><span class="k" data-i18n="ui.rd.cursor"></span> <span class="v" id="rd-cur">—</span></span>
        <span><span class="k" data-i18n="ui.rd.features"></span> <span class="v" id="rd-n">0</span></span>
        <span class="spacer"></span>
        <span><span class="k" data-i18n="ui.rd.width"></span> <span class="v" id="rd-w">—</span></span>
        <span><span class="k" data-i18n="ui.rd.height"></span> <span class="v" id="rd-h">—</span></span>
      </div>
      <canvas id="cv"></canvas>
      <div class="vp-foot">
        <span id="sb-label">—</span>
        <span class="scalebar" id="sb" style="width:0"></span>
        <span class="spacer" style="margin-left:auto"></span>
        <span id="rd-unit">—</span>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-t="log" data-i18n="ui.tab.log"></button>
        <button role="tab" aria-selected="false" data-t="attr" data-i18n="ui.tab.attr"></button>
      </div>
      <div id="pane-log">
        <div class="log-h"><h2 class="sr" data-i18n="ui.log.heading"></h2><span></span><span class="count" id="logcount"></span></div>
        <ul class="log" id="log"></ul>
      </div>
      <div id="pane-attr" hidden><div class="tblwrap" id="tbl"><div class="empty" data-i18n="ui.attr.empty"></div></div></div>
    </div>
  </div>
</div>

<footer>
  <span data-i18n="ui.footer.local"></span>
  <span data-i18n="ui.footer.proj"></span>
  <span data-i18n="ui.footer.ed50"></span>
</footer>
</div>

<script>/*__I18N__*/</script>
<script>/*__GEOCONV__*/</script>
<script>/*__PROJ__*/</script>
<script>/*__ZIP__*/</script>
<script>
(function(){
'use strict';
var G=window.GeoConv, P=window.Proj, Z=window.Zip;
var t=window.t, I18N=window.I18N;

/* ---------------- i18n binding ----------------
   Markup carries data-i18n / data-i18n-title / data-i18n-aria attributes.
   Elements whose text depends on runtime values store the key on the element
   through setHint, so a language change re-renders them without re-running
   the logic that produced them. */
function setHint(id,key,args){
  var el=document.getElementById(id); if(!el) return;
  el.setAttribute('data-i18n',key);
  el.setAttribute('data-i18n-args',JSON.stringify(args||[]));
  el.textContent=t.apply(null,[key].concat(args||[]));
}
function applyI18n(){
  document.documentElement.setAttribute('lang',I18N.getLang());
  document.title=t('ui.title');
  var nodes=document.querySelectorAll('[data-i18n]');
  Array.prototype.forEach.call(nodes,function(el){
    if(el.tagName==='TITLE') return;
    var a=[]; try{ a=JSON.parse(el.getAttribute('data-i18n-args')||'[]'); }catch(e){}
    el.textContent=t.apply(null,[el.getAttribute('data-i18n')].concat(a));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'),function(el){
    el.title=t(el.getAttribute('data-i18n-title'));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'),function(el){
    el.setAttribute('aria-label',t(el.getAttribute('data-i18n-aria')));
  });
}
function switchLang(){
  I18N.setLang(I18N.getLang()==='tr'?'en':'tr');
  applyI18n();
  fillCrs($('src'),S.src); fillCrs($('dst'),S.dst);
  onDst(); renderLog(); if(S.fc) renderTable();
}

/* ---------------- CRS list ---------------- */
var CRS_LIST=[
 ['EPSG:4326','ui.crs.wgs84geo'],
 ['EPSG:3857','ui.crs.webmerc'],
 ['—1','ui.crs.group.turef'],
 ['EPSG:5253','TUREF / TM27 (m)'],['EPSG:5254','TUREF / TM30 (m)'],['EPSG:5255','TUREF / TM33 (m)'],
 ['EPSG:5256','TUREF / TM36 (m)'],['EPSG:5257','TUREF / TM39 (m)'],['EPSG:5258','TUREF / TM42 (m)'],
 ['EPSG:5259','TUREF / TM45 (m)'],
 ['—2','ui.crs.group.utm'],
 ['EPSG:32635','WGS84 / UTM 35N (m)'],['EPSG:32636','WGS84 / UTM 36N (m)'],['EPSG:32637','WGS84 / UTM 37N (m)'],
 ['—3','ui.crs.group.ed50'],
 ['EPSG:23035','ED50 / UTM 35N (m)'],['EPSG:23036','ED50 / UTM 36N (m)'],['EPSG:23037','ED50 / UTM 37N (m)'],
 ['—4','ui.crs.group.other']
];
for(var z=28;z<=40;z++) if([35,36,37].indexOf(z)<0) CRS_LIST.push(['EPSG:'+(32600+z),'WGS84 / UTM '+z+'N (m)']);

function fillCrs(sel,val){
  sel.innerHTML='';
  CRS_LIST.forEach(function(c){
    var o=document.createElement('option');
    var lbl=c[1].indexOf('ui.crs.')===0?t(c[1]):c[1];
    if(c[0][0]==='—'){o.disabled=true;o.textContent=lbl;}
    else{o.value=c[0];o.textContent=lbl+'  ·  '+c[0];}
    sel.appendChild(o);
  });
  sel.value=val;
}
function crsOf(code){ return P.REG[code]||P.REG['EPSG:4326']; }
function unitOf(code){ return crsOf(code).units; }
function utmZoneFor(lon){ return Math.max(1,Math.min(60,Math.floor((lon+180)/6)+1)); }
function trTmFor(lon){
  var best=null,bd=1e9;
  [[5253,27],[5254,30],[5255,33],[5256,36],[5257,39],[5258,42],[5259,45]].forEach(function(zn){
    var d=Math.abs(lon-zn[1]); if(d<bd){bd=d;best=zn[0];}
  });
  return bd<=1.6?'EPSG:'+best:null;
}

/* ---------------- state ---------------- */
var S={fc:null,src:'EPSG:4326',dst:'EPSG:4326',fmt:'dxf',proj:null,name:'output',keys:[],log:[]};
var $=function(id){return document.getElementById(id);};

/* ---------------- log ---------------- */
function clearLog(){S.log=[];}
/* Log entries store the message identifier and its arguments, not rendered
   text, so the language can change at any time and so that a diagnostic can be
   referred to by a stable identifier independent of display language. */
function L(level,tag,key,args,fix){S.log.push({level:level,tag:tag,key:key,args:args||[],fix:fix});}
function renderLog(){
  var ul=$('log');ul.innerHTML='';
  if(!S.log.length){
    var li0=document.createElement('li');
    var d0=document.createElement('div');d0.className='empty';d0.style.gridColumn='1/-1';
    d0.textContent=t('ui.log.empty');li0.appendChild(d0);ul.appendChild(li0);
    $('logcount').textContent='';return;}
  var nw=S.log.filter(function(l){return l.level==='warn'||l.level==='err';}).length;
  $('logcount').textContent=t('ui.log.count',S.log.length,nw);
  S.log.forEach(function(l){
    var li=document.createElement('li');li.className='lv-'+l.level;
    var tg=document.createElement('div');tg.className='tag';tg.textContent=t('tag.'+l.tag);
    var m=document.createElement('div');m.textContent=t.apply(null,[l.key].concat(l.args));
    if(l.fix){
      var b=document.createElement('button');b.className='fix';b.textContent=t.apply(null,[l.fix.key].concat(l.fix.args||[]));
      b.onclick=l.fix.run;m.appendChild(document.createElement('br'));m.appendChild(b);
    }
    li.appendChild(tg);li.appendChild(m);ul.appendChild(li);
  });
}

/* ---------------- readers ---------------- */
function extOf(n){var m=/\.([A-Za-z0-9]+)$/.exec(n);return m?m[1].toLowerCase():'';}
function baseOf(n){return n.replace(/\.[A-Za-z0-9]+$/,'').replace(/^.*\//,'');}

function kmlToFc(text){
  var doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.querySelector('parsererror')) throw new Error(t('err.kml.parse'));
  var pls=doc.getElementsByTagName('Placemark'),feats=[];
  for(var i=0;i<pls.length;i++){
    var pl=pls[i],props={},g=kmlGeomOf(pl);
    var nm=pl.getElementsByTagName('name')[0];
    if(nm&&nm.parentNode===pl) props.name=nm.textContent.trim();
    var ds=pl.getElementsByTagName('description')[0];
    if(ds&&ds.parentNode===pl) props.description=ds.textContent.trim();
    var dt=pl.getElementsByTagName('Data');
    for(var j=0;j<dt.length;j++){
      var k=dt[j].getAttribute('name'),v=dt[j].getElementsByTagName('value')[0];
      if(k) props[k]=v?v.textContent.trim():'';
    }
    var sd=pl.getElementsByTagName('SimpleData');
    for(var s=0;s<sd.length;s++){var kk=sd[s].getAttribute('name');if(kk)props[kk]=sd[s].textContent.trim();}
    if(g) feats.push({type:'Feature',properties:props,geometry:g});
  }
  return {type:'FeatureCollection',features:feats};
}
function kmlGeomOf(pl){
  var out=[],order=['Point','LineString','Polygon'];
  function grab(tag,build){
    var e=pl.getElementsByTagName(tag);
    for(var i=0;i<e.length;i++){var g=build(e[i]);if(g)out.push(g);}
  }
  grab('Point',function(e){var c=G.parseCoordText(txt(e,'coordinates'));return c.length?{type:'Point',coordinates:c[0]}:null;});
  grab('LineString',function(e){var c=G.parseCoordText(txt(e,'coordinates'));return c.length>1?{type:'LineString',coordinates:c}:null;});
  grab('Polygon',function(e){
    var rings=[],ob=e.getElementsByTagName('outerBoundaryIs')[0];
    if(ob){var c=G.parseCoordText(txt(ob,'coordinates'));if(c.length>2)rings.push(G.orient(c,true));}
    var ib=e.getElementsByTagName('innerBoundaryIs');
    for(var i=0;i<ib.length;i++){var h=G.parseCoordText(txt(ib[i],'coordinates'));if(h.length>2)rings.push(G.orient(h,false));}
    return rings.length?{type:'Polygon',coordinates:rings}:null;
  });
  if(!out.length) return null;
  if(out.length===1) return out[0];
  var ty=out[0].type,same=out.every(function(g){return g.type===ty;});
  if(same) return {type:'Multi'+ty,coordinates:out.map(function(g){return g.coordinates;})};
  return {type:'GeometryCollection',geometries:out};
}
function txt(el,tag){var e=el.getElementsByTagName(tag)[0];return e?e.textContent:'';}

function gpxToFc(text){
  var doc=new DOMParser().parseFromString(text,'text/xml'),feats=[];
  function pts(nodes){var a=[];for(var i=0;i<nodes.length;i++){
    var x=parseFloat(nodes[i].getAttribute('lon')),y=parseFloat(nodes[i].getAttribute('lat'));
    if(isFinite(x)&&isFinite(y))a.push([x,y]);}return a;}
  var wpt=doc.getElementsByTagName('wpt');
  for(var i=0;i<wpt.length;i++){
    var c=pts([wpt[i]])[0];if(!c)continue;
    feats.push({type:'Feature',properties:{name:txt(wpt[i],'name'),ele:parseFloat(txt(wpt[i],'ele'))||null,type:'wpt'},geometry:{type:'Point',coordinates:c}});
  }
  ['trk','rte'].forEach(function(tag){
    var els=doc.getElementsByTagName(tag);
    for(var k=0;k<els.length;k++){
      var nodes=els[k].getElementsByTagName(tag==='trk'?'trkpt':'rtept'),c=pts(nodes);
      if(c.length>1)feats.push({type:'Feature',properties:{name:txt(els[k],'name'),type:tag},geometry:{type:'LineString',coordinates:c}});
    }
  });
  return {type:'FeatureCollection',features:feats};
}

function wktGuess(prj){
  if(!prj) return null;
  var p=prj.replace(/\s+/g,' ');
  if(/PROJCS/i.test(p)){
    var cm=/Central_Meridian",\s*(-?[\d.]+)/i.exec(p), k0=/Scale_Factor",\s*([\d.]+)/i.exec(p);
    var fe=/False_Easting",\s*(-?[\d.]+)/i.exec(p), fn=/False_Northing",\s*(-?[\d.]+)/i.exec(p);
    if(/Mercator_Auxiliary_Sphere|Popular_Visualisation|WGS_1984_Web_Mercator/i.test(p)) return {code:'EPSG:3857',how:'PROJCS → Web Mercator'};
    if(cm&&k0){
      var lon0=parseFloat(cm[1]),sf=parseFloat(k0[1]);
      var ed50=/European_1950|International_1924/i.test(p);
      if(Math.abs(sf-1)<1e-9){
        var tz=trTmFor(lon0); if(tz) return {code:tz,how:'PROJCS → TUREF TM'+lon0};
      }
      if(Math.abs(sf-0.9996)<1e-6){
        var zone=Math.round((lon0+183)/6);
        if(zone>=1&&zone<=60) return {code:'EPSG:'+((ed50?23000:32600)+zone)+'',how:'PROJCS → '+(ed50?'ED50':'WGS84')+' UTM '+zone+'N'};
      }
    }
    return {code:null,how:t('err.prj.unmatched')};
  }
  if(/European_1950|ED_1950/i.test(p)) return {code:'EPSG:4230',how:'GEOGCS → ED50'};
  if(/GEOGCS/i.test(p)) return {code:'EPSG:4326',how:'GEOGCS → WGS 84'};
  return null;
}

async function ingest(fileList){
  clearLog();
  var files=Array.prototype.slice.call(fileList);
  var bag={};  // basename -> {shp,dbf,prj,cpg}
  var single=null, prjText=null, srcGuess=null, total=0;
  var entries=[];
  for(var i=0;i<files.length;i++){
    var f=files[i], e=extOf(f.name); total+=f.size;
    if(e==='zip'){
      var items=await Z.unzip(await f.arrayBuffer());
      items.forEach(function(it){ entries.push({name:it.name,data:it.data}); });
      L('info','zip','log.zip.opened',[f.name,items.length]);
    } else entries.push({name:f.name,file:f});
  }
  for(var j=0;j<entries.length;j++){
    var en=entries[j], ex=extOf(en.name), b=baseOf(en.name);
    if(/^__MACOSX/.test(en.name)) continue;
    if(['shp','dbf','shx','prj','cpg'].indexOf(ex)>=0){
      bag[b]=bag[b]||{};
      bag[b][ex]=en.data?en.data:new Uint8Array(await en.file.arrayBuffer());
    } else if(['geojson','json','kml','gpx','csv','txt'].indexOf(ex)>=0){
      var raw=en.data?new TextDecoder().decode(en.data):await en.file.text();
      single={ext:ex,text:raw,name:b};
    }
  }
  var fc=null,name='output';
  var keys=Object.keys(bag).filter(function(k){return bag[k].shp;});
  if(keys.length){
    if(keys.length>1) L('warn','multiple','log.shp.multiple',[keys[0],keys.slice(1).join(', ')]);
    var b0=bag[keys[0]]; name=keys[0];
    var geoms=G.readShp(b0.shp,warnFn);
    var rows=[],fieldNames=[];
    if(b0.dbf){
      var enc=b0.cpg?new TextDecoder().decode(b0.cpg).trim().toLowerCase():'';
      var isUtf=/utf-?8|65001/.test(enc);
      if(!b0.cpg) L('warn','encoding','log.shp.noCpg');
      var d=G.readDbf(b0.dbf,isUtf?'utf8':'latin1');
      rows=d.rows; fieldNames=d.fields.map(function(f){return f.name;});
      if(rows.length!==geoms.length) L('warn','mismatch','log.shp.recordMismatch',[geoms.length,rows.length]);
    } else L('warn','missing','log.shp.noDbf');
    if(!b0.shx) L('info','missing','log.shp.noShx');
    var feats=[];
    for(var g=0;g<geoms.length;g++){ if(geoms[g]) feats.push({type:'Feature',properties:rows[g]||{},geometry:geoms[g]}); }
    if(geoms.length-feats.length>0) L('warn','empty','log.geom.emptyDropped',[geoms.length-feats.length]);
    fc={type:'FeatureCollection',features:feats};
    if(b0.prj){ prjText=new TextDecoder().decode(b0.prj); srcGuess=wktGuess(prjText); }
    else L('warn','prj','log.crs.noPrj');
  } else if(single){
    name=single.name;
    if(single.ext==='geojson'||single.ext==='json'){
      var o=JSON.parse(single.text);
      if(o.type==='FeatureCollection') fc=o;
      else if(o.type==='Feature') fc={type:'FeatureCollection',features:[o]};
      else if(o.type) fc={type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:o}]};
      else throw new Error(t('err.geojson.shape'));
      if(o.crs&&o.crs.properties&&/EPSG::?(\d+)/i.test(JSON.stringify(o.crs))){
        var m=/EPSG::?(\d+)/i.exec(JSON.stringify(o.crs));
        if(P.REG['EPSG:'+m[1]]) srcGuess={code:'EPSG:'+m[1],how:'GeoJSON crs member (legacy)'};
      } else srcGuess={code:'EPSG:4326',how:'RFC 7946 default'};
    }
    else if(single.ext==='kml'){fc=kmlToFc(single.text);srcGuess={code:'EPSG:4326',how:'KML is always WGS 84'};}
    else if(single.ext==='gpx'){fc=gpxToFc(single.text);srcGuess={code:'EPSG:4326',how:'GPX is always WGS 84'};}
    else {fc=G.csvToFc(single.text);L('info','csv','log.csv.columnsFound');
      /* CSV carries no place to declare a reference system, so the
         ambiguity is structural rather than an omission by whoever
         produced the file. */
      L('warn','csv','log.crs.csvUndeclared');}
  } else throw new Error(t('err.noVectorFile'));

  if(!fc.features.length) throw new Error(t('err.noGeometry'));
  S.fc=fc; S.name=name;

  var counts={point:0,line:0,polygon:0,other:0};
  fc.features.forEach(function(f){var c=G.shapeClass(f.geometry);counts[c||'other']++;});
  var parts=[];
  if(counts.point)parts.push(t('count.point',counts.point));
  if(counts.line)parts.push(t('count.line',counts.line));
  if(counts.polygon)parts.push(t('count.polygon',counts.polygon));
  if(counts.other)parts.push(t('count.other',counts.other));
  L('ok','read','log.read.summary',[fc.features.length,parts.join(', ')]);
  if(total>0) L('info','size','log.read.inputSize',[fmtBytes(total)]);
  if(fc.features.length>60000) L('warn','large','log.read.large');

  // attribute keys
  var kk=[],seen={};
  fc.features.forEach(function(f){Object.keys(f.properties||{}).forEach(function(k){if(!seen[k]){seen[k]=1;kk.push(k);}});});
  S.keys=kk;

  // source CRS
  if(srcGuess&&srcGuess.code){ S.src=srcGuess.code; setHint('srchint','ui.hint.prjRead',[srcGuess.how]); }
  else if(srcGuess){ setHint('srchint','ui.hint.prjUnmatched'); L('warn','prj','log.crs.prjUnmatched'); }
  else {
    var g=guessFromExtent(fc);
    if(g){ S.src=g; setHint('srchint','ui.hint.guessed'); }
    else { setHint('srchint','ui.hint.gridUndetermined');
           L('warn','prj','log.crs.zoneUndetermined'); }
  }
  fillCrs($('src'),S.src);
  if(S.dst==='EPSG:4326'&&unitOf(S.src)!=='deg') S.dst=S.src;
  fillCrs($('dst'),S.dst);
  fillAttrSelects();
  reproject();
}
/* Guessing from the coordinate range can distinguish geographic from
   projected, and a false-easting grid from Web Mercator, but it cannot
   identify which zone a grid belongs to: every three-degree zone places its
   central meridian at 500000, so TM27 and TM45 data look identical. Returning
   a specific zone in that case would be a guess dressed as a determination, so
   the function returns null instead and the caller asks. */
function guessFromExtent(fc){
  var bb=G.fcBbox(fc); if(!bb) return 'EPSG:4326';
  if(bb[0]>=-180&&bb[2]<=180&&bb[1]>=-90&&bb[3]<=90) return 'EPSG:4326';
  var e=(bb[0]+bb[2])/2, nth=(bb[1]+bb[3])/2;
  // A transverse Mercator grid with a 500000 false easting keeps eastings in
  // the hundreds of thousands; Web Mercator puts them in the millions.
  if(e>1e5&&e<9e5&&nth>1e6&&nth<1e7) return null;      // grid, zone unknown
  if(Math.abs(e)<2e7&&Math.abs(nth)<2e7&&nth>1e6) return 'EPSG:3857';
  return 'EPSG:4326';
}
function fmtBytes(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';}

/* ---------------- reprojection ---------------- */
function reproject(){
  if(!S.fc){S.proj=null;draw();return;}
  var a=crsOf(S.src),b=crsOf(S.dst);
  var same=S.src===S.dst;
  var bad=0;
  var out={type:'FeatureCollection',features:S.fc.features.map(function(f){
    if(same) return f;
    return {type:'Feature',properties:f.properties,geometry:mapGeom(f.geometry,function(c){
      var w=a.toWgs84(c[0],c[1]);
      if(!isFinite(w[0])||!isFinite(w[1])){bad++;return [0,0];}
      var p=b.fromWgs84(w[0],w[1]);
      if(!isFinite(p[0])||!isFinite(p[1])){bad++;return [0,0];}
      return c.length>2?[p[0],p[1],c[2]]:[p[0],p[1]];
    })};
  })};
  S.proj=out;
  if(bad) L('err','projection','log.proj.failed',[bad]);
  draw();
  renderTable();
  checkOutput();
}
function mapGeom(g,fn){
  if(!g) return g;
  if(g.type==='GeometryCollection') return {type:'GeometryCollection',geometries:g.geometries.map(function(x){return mapGeom(x,fn);})};
  var d={Point:0,MultiPoint:1,LineString:1,MultiLineString:2,Polygon:2,MultiPolygon:3}[g.type];
  if(d===undefined) return g;
  function walk(a,k){ return k===0?fn(a):a.map(function(x){return walk(x,k-1);}); }
  return {type:g.type,coordinates:walk(g.coordinates,d)};
}

/* ---------------- canvas ---------------- */
var cv=$('cv'),ctx=cv.getContext('2d'),VIEW=null;
function sizeCanvas(){
  var r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width,h:r.height};
}
var PAL=['#1D4E89','#9B2B22','#1C6547','#8E6205','#5B3A86','#0F6F80','#A0456F','#4C6B12'];
function draw(){
  var d=sizeCanvas();ctx.clearRect(0,0,d.w,d.h);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,d.w,d.h);
  var fc=S.proj;
  if(!fc||!fc.features.length){
    ctx.fillStyle='#9AA7AF';ctx.font='12px "IBM Plex Mono",monospace';ctx.textAlign='center';
    ctx.fillText('geometri yok',d.w/2,d.h/2);
    $('rd-n').textContent='0';$('rd-w').textContent='—';$('rd-h').textContent='—';
    $('rd-unit').textContent='—';$('sb').style.width='0';$('sb-label').textContent='—';$('legend').innerHTML='';
    return;
  }
  var bb=G.fcBbox(fc)||[0,0,1,1];
  var bw=Math.max(bb[2]-bb[0],1e-12),bh=Math.max(bb[3]-bb[1],1e-12);
  var pad=26,sc=Math.min((d.w-2*pad)/bw,(d.h-2*pad)/bh);
  var ox=(d.w-bw*sc)/2-bb[0]*sc, oy=(d.h+bh*sc)/2+bb[1]*sc;
  VIEW={sc:sc,ox:ox,oy:oy,bb:bb,w:d.w,h:d.h};
  var X=function(x){return x*sc+ox;},Y=function(y){return oy-y*sc;};

  // grid at a nice interval
  var step=niceStep(bw/6);
  ctx.strokeStyle='#EAEFF1';ctx.lineWidth=1;ctx.beginPath();
  for(var gx=Math.ceil(bb[0]/step)*step;gx<=bb[2];gx+=step){var px=Math.round(X(gx))+.5;ctx.moveTo(px,0);ctx.lineTo(px,d.h);}
  for(var gy=Math.ceil(bb[1]/step)*step;gy<=bb[3];gy+=step){var py=Math.round(Y(gy))+.5;ctx.moveTo(0,py);ctx.lineTo(d.w,py);}
  ctx.stroke();

  // layer colours by chosen field
  var lf=$('lf').value,cmap={},clist=[];
  function colOf(f){
    if(!lf) return PAL[0];
    var v=String((f.properties||{})[lf]);
    if(!(v in cmap)){cmap[v]=PAL[clist.length%PAL.length];clist.push(v);}
    return cmap[v];
  }
  var thin=fc.features.length>4000;
  ctx.lineJoin='round';ctx.lineCap='round';
  fc.features.forEach(function(f){
    var g=f.geometry;if(!g)return;
    var col=colOf(f),cls=G.shapeClass(g);
    if(cls==='point'){
      ctx.fillStyle=col;
      G.pointsOf(g).forEach(function(c){ctx.beginPath();ctx.arc(X(c[0]),Y(c[1]),thin?1.4:2.6,0,6.283);ctx.fill();});
    } else if(cls){
      var poly=cls==='polygon';
      ctx.strokeStyle=col;ctx.lineWidth=poly?1:1.3;
      ctx.fillStyle=col+'22';
      G.partsOf(g).forEach(function(p){
        if(p.length<2)return;
        ctx.beginPath();ctx.moveTo(X(p[0][0]),Y(p[0][1]));
        for(var i=1;i<p.length;i++)ctx.lineTo(X(p[i][0]),Y(p[i][1]));
        if(poly){ctx.closePath();ctx.fill();}
        ctx.stroke();
      });
    }
  });

  var u=unitOf(S.dst)==='deg'?'°':'m';
  $('rd-n').textContent=fc.features.length.toLocaleString('tr');
  $('rd-w').textContent=fmtLen(bw,u); $('rd-h').textContent=fmtLen(bh,u);
  $('rd-unit').textContent=(unitOf(S.dst)==='deg'?'birim: derece':'birim: metre')+' · '+S.dst;
  var target=Math.min(160,d.w*0.25),sbLen=niceStep(target/sc);
  $('sb').style.width=Math.round(sbLen*sc)+'px';
  $('sb-label').textContent=fmtLen(sbLen,u);
  var lg=$('legend');lg.innerHTML='';
  if(lf&&clist.length){
    clist.slice(0,10).forEach(function(v){
      var s=document.createElement('span');
      s.innerHTML='<i style="background:'+cmap[v]+'"></i>'+(v===''||v==='undefined'?t('ui.value.blank'):v);
      lg.appendChild(s);
    });
    if(clist.length>10){var m=document.createElement('span');m.style.color='var(--muted)';m.textContent='+'+(clist.length-10+' daha');lg.appendChild(m);}
  }
}
function niceStep(x){
  if(!isFinite(x)||x<=0)return 1;
  var e=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),m=x/e;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e;
}
function fmtLen(v,u){
  if(u==='°') return v.toFixed(v<1?5:3)+'°';
  if(v>=1000) return (v/1000).toFixed(v>=10000?0:2)+' km';
  if(v>=1) return v.toFixed(v>=100?0:1)+' m';
  return (v*100).toFixed(1)+' cm';
}
cv.addEventListener('pointermove',function(e){
  if(!VIEW){$('rd-cur').textContent='—';return;}
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left-VIEW.ox)/VIEW.sc, y=(VIEW.oy-(e.clientY-r.top))/VIEW.sc;
  var deg=unitOf(S.dst)==='deg';
  $('rd-cur').textContent=deg?(x.toFixed(6)+', '+y.toFixed(6)):(Math.round(x).toLocaleString('tr')+', '+Math.round(y).toLocaleString('tr'));
});
cv.addEventListener('pointerleave',function(){$('rd-cur').textContent='—';});
window.addEventListener('resize',function(){draw();});

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function fillAttrSelects(){
  [['lf','— tek katman (0) —'],['tf','— etiket yazma —'],['lab2','— ad yok —']].forEach(function(p){

/* ---------------- pre-flight checks ---------------- */
function checkOutput(){
  S.log=S.log.filter(function(l){return l.tag!=='scale'&&l.tag!=='format';});
  var ok=!!S.fc;
  if(S.fc){
    var deg=unitOf(S.dst)==='deg';
    if(S.fmt==='dxf'&&deg){
      var bb=G.fcBbox(S.proj||S.fc)||[0,0,0,0];
      var lon=(bb[0]+bb[2])/2, sug=trTmFor(lon)||('EPSG:'+(32600+utmZoneFor(lon)));
      L('err','scale','log.dxf.degreeUnits',[(bb[2]-bb[0]).toFixed(4),(bb[3]-bb[1]).toFixed(4)],
        {key:'log.dxf.fixTarget',args:[P.REG[sug]?sug:'EPSG:3857'],run:function(){
          S.dst=P.REG[sug]?sug:'EPSG:3857'; $('dst').value=S.dst; onDst(); }});
    }
    if(S.fmt==='dxf'){
      L('info','format','log.dxf.formatNote');
    }
    if(S.fmt==='shp'){
      var counts={};S.fc.features.forEach(function(f){var c=G.shapeClass(f.geometry);counts[c||'other']=(counts[c||'other']||0)+1;});
      var n=['point','line','polygon'].filter(function(k){return counts[k];}).length;
      if(n>1) L('warn','format','log.shp.multipleTypes',[n]);
      L('info','format','log.shp.fieldNote');
    }
    if(S.fmt==='csv') L('warn','format','log.csv.centroidOnly');
    if(S.fmt==='kml'&&unitOf(S.dst)!=='deg') L('warn','format','log.kml.forcesWgs84');
  }

}

/* ---------------- convert & download ---------------- */
function dl(blob,fname){
  var a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);
}
function warnFn(tag,key,args){L('warn',tag,key,args);}

function convert(){
  if(!S.fc)return;
  var fc=S.proj||S.fc, base=S.name.replace(/[^\w.-]+/g,'_')||'output';
  /* Losses the chosen target cannot represent are stated before writing, so
     they appear even when the writer itself has nothing to say about them. */
  if(G.hasZ(fc)&&(S.fmt==='shp'||S.fmt==='csv')) L('warn','geometry','log.geom.zDropped',[S.fmt.toUpperCase()]);
  if(S.fmt!=='geojson'){
    var noGeom=S.fc.features.filter(function(f){return !f.geometry;}).length;
    if(noGeom) L('warn','empty','log.out.emptySkipped',[noGeom]);
  }
  if(S.fmt!=='geojson'){
    var withId=S.fc.features.filter(function(f){return f.id!==undefined&&f.id!==null;}).length;
    if(withId) L('warn','field','log.geom.idDropped',[withId]);
  }
  try{
    if(S.fmt==='geojson'){
      var body=JSON.stringify(unitOf(S.dst)==='deg'?fc:fc,null,0);
      if(unitOf(S.dst)!=='deg') L('warn','compat','log.geojson.notWgs84',[S.dst]);
      dl(new Blob([body],{type:'application/geo+json'}),base+'.geojson');
    }
    else if(S.fmt==='kml'){
      var wgs=S.dst==='EPSG:4326'?fc:{type:'FeatureCollection',features:S.fc.features.map(function(f){
        var a=crsOf(S.src);return {type:'Feature',properties:f.properties,geometry:mapGeom(f.geometry,function(c){return a.toWgs84(c[0],c[1]);})};})};
      dl(new Blob([G.writeKml(wgs,{labelField:$('lab2').value||null})],{type:'application/vnd.google-earth.kml+xml'}),base+'.kml');
    }
    else if(S.fmt==='csv'){
      dl(new Blob(['\ufeff'+G.fcToCsv(fc)],{type:'text/csv;charset=utf-8'}),base+'.csv');
    }
    else if(S.fmt==='dxf'){
      var r=G.writeDxf(fc,{layerField:$('lf').value||null,labelField:$('tf').value||null,
        textHeight:parseFloat($('th').value)||1,asciiText:true},warnFn);
      L('ok','written','log.dxf.written',[r.entities.toLocaleString(I18N.locale()),r.layers.length,r.layers.join(', ')]);
      dl(new Blob([r.text],{type:'application/dxf'}),base+'.dxf');
    }
    else if(S.fmt==='shp'){
      var groups={point:[],line:[],polygon:[]},skipped=0;
      fc.features.forEach(function(f){
        if(!f.geometry) return;            // already stated before writing
        var c=G.shapeClass(f.geometry);
        if(c)groups[c].push(f);else skipped++;
      });
      if(skipped) L('warn','skipped','log.dxf.skipped',[skipped]);
      var wkt=wktFor(S.dst), entries=[], made=[];
      ['point','line','polygon'].forEach(function(c){
        var fs=groups[c];if(!fs.length)return;
        var suffix=Object.keys(groups).filter(function(k){return groups[k].length;}).length>1?'_'+c:'';
        var nm=base+suffix;
        var fields=G.inferFields(fs,warnFn);
        var sx=G.writeShpShx(fs,c);
        entries.push({name:nm+'.shp',data:sx.shp},{name:nm+'.shx',data:sx.shx},
          {name:nm+'.dbf',data:G.writeDbf(fs,fields)},
          {name:nm+'.prj',data:new TextEncoder().encode(wkt)},
          {name:nm+'.cpg',data:new TextEncoder().encode('UTF-8')});
        made.push(nm+' ('+fs.length+')');
      });
      if(!entries.length){L('err','empty','log.out.nothing');renderLog();return;}
      L('ok','written','log.shp.written',[made.join(', ')]);
      dl(new Blob([Z.zipStore(entries)],{type:'application/zip'}),base+'_shp.zip');
    }
  }catch(err){ L('err','error','log.error',[err.message||String(err)]); }
  renderLog();
}
function wktFor(code){
  var c=crsOf(code);
  if(code==='EPSG:4326'||code==='EPSG:4258') return G.WKT[4326];
  if(code==='EPSG:3857') return G.WKT[3857];
  var m=/EPSG:(\d+)/.exec(code); var n=m?+m[1]:0;
  if(n>=32601&&n<=32660) return G.utmWkt(n-32600,true,'WGS84');
  if(n>=23028&&n<=23038) return G.utmWkt(n-23000,true,'ED50');
  if(n>=5253&&n<=5259) return G.tmWkt(c.lon0);
  return G.WKT[4326];
}

/* ---------------- wiring ---------------- */
$('drop').addEventListener('click',function(){$('file').click();});
$('drop').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();}});
['dragenter','dragover'].forEach(function(ev){$('drop').addEventListener(ev,function(e){e.preventDefault();this.classList.add('hot');});});
['dragleave','drop'].forEach(function(ev){$('drop').addEventListener(ev,function(e){e.preventDefault();this.classList.remove('hot');});});
$('drop').addEventListener('drop',function(e){handle(e.dataTransfer.files);});
$('file').addEventListener('change',function(){handle(this.files);});

function handle(fl){
  if(!fl||!fl.length)return;
  var ul=$('filelist');ul.innerHTML='';
  Array.prototype.forEach.call(fl,function(f){
    var li=document.createElement('li');
    li.innerHTML='<span class="ext">'+esc(extOf(f.name)||'?')+'</span><span>'+esc(f.name)+'</span><span class="sz">'+fmtBytes(f.size)+'</span>';
    ul.appendChild(li);
  });
  ingest(fl).then(function(){checkOutput();}).catch(function(err){
    S.fc=null;S.proj=null;clearLog();
    L('err','error','log.error',[err.message||String(err)]);
    draw();renderTable();checkOutput();
  });
}
function onDst(){S.dst=$('dst').value;setHint('dsthint',unitOf(S.dst)==='deg'?'ui.hint.dstDeg':'ui.hint.dstMetre');reproject();}
$('src').addEventListener('change',function(){S.src=this.value;setHint('srchint','ui.hint.srcManual');reproject();});
$('dst').addEventListener('change',onDst);
$('lf').addEventListener('change',draw);
document.querySelectorAll('#fmt button').forEach(function(b){
  b.addEventListener('click',function(){
    if(this.disabled)return;
    document.querySelectorAll('#fmt button').forEach(function(x){x.setAttribute('aria-pressed','false');});
    this.setAttribute('aria-pressed','true');S.fmt=this.dataset.f;
    $('opt-dxf').hidden=S.fmt!=='dxf';
    $('opt-lab').hidden=S.fmt!=='kml';
    checkOutput();
  });
});
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-selected','false');});
    this.setAttribute('aria-selected','true');
    $('pane-log').hidden=this.dataset.t!=='log';
    $('pane-attr').hidden=this.dataset.t!=='attr';
  });
});
$('go').addEventListener('click',convert);
$('lang').addEventListener('click',switchLang);

/* Text is bound before anything else runs, so a failure further down the
   initialisation chain cannot leave the interface blank. */
$('capzip').setAttribute('data-i18n',(typeof DecompressionStream!=='undefined')?'ui.zip.rw':'ui.zip.wo');
applyI18n();
fillCrs($('src'),S.src);fillCrs($('dst'),S.dst);onDst();
if(typeof DecompressionStream!=='undefined')$('capzip').classList.add('on');
draw();renderLog();
})();
</script>
